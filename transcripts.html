<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Inside the Runs</title>
<style>
:root {
  --bg: #f8f9fa; --panel: #ffffff; --ink: #202124; --muted: #5f6368; --line: #dadce0;
  --code-bg: #202124; --code-ink: #e8eaed; --code-dim: #9aa0a6;
  --red: #c5221f; --red-tint: #fce8e6; --green: #137333; --green-tint: #e6f4ea;

}

  :root:not([data-theme="light"]) {
    --bg: #17181a; --panel: #202124; --ink: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
    --code-bg: #0f1012; --code-ink: #e8eaed; --code-dim: #80868b;
    --red: #f28b82; --red-tint: #3b2321; --green: #81c995; --green-tint: #1e3325;
    --amber: #fdd663; --amber-tint: #3a3220; --blue: #8ab4f8; --blue-tint: #1f2a3d;
    --think: #b6a9f0; --think-tint: #29263a;
  }
}
:root[data-theme="dark"] {
  --bg: #17181a; --panel: #202124; --ink: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
  --code-bg: #0f1012; --code-ink: #e8eaed; --code-dim: #80868b;
  --red: #f28b82; --red-tint: #3b2321; --green: #81c995; --green-tint: #1e3325;
  --amber: #fdd663; --amber-tint: #3a3220; --blue: #8ab4f8; --blue-tint: #1f2a3d;
  --think: #b6a9f0; --think-tint: #29263a;
}
* { box-sizing: border-box; }
html { font-size: 18px; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Google Sans", "Google Sans Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
code, pre, .mono { font-family: "Google Sans Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1200px; margin: 0 auto; padding: 14px 24px 0; }
.title-row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.title-row h1 { font-size: 1.35rem; margin: 0; }
.title-row .sub { color: var(--muted); font-size: .85rem; flex: 1; min-width: 240px; }
.tools { display: flex; gap: 8px; }
button { font: inherit; font-size: .8rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 0; scrollbar-width: none; }
nav.tabs button { border-radius: 10px 10px 0 0; border-bottom: none; white-space: nowrap; padding: 8px 16px; font-size: .85rem; }
nav.tabs button .k { color: var(--muted); margin-right: 6px; font-size: .75rem; }
nav.tabs button[aria-pressed="true"] .k { color: inherit; opacity: .7; }

main { max-width: 1200px; margin: 0 auto; padding: 24px; }
.cols { display: grid; gap: 24px; grid-template-columns: 1fr; }
.cols.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .cols.two { grid-template-columns: 1fr; } }

.run-head { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 18px; }
.run-head h2 { margin: 0 0 4px; font-size: 1.3rem; }
.blurb { color: var(--muted); margin: 0 0 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { font-size: .72rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.on { color: var(--green); border-color: var(--green); }
.chip.off { color: var(--red); border-color: var(--red); }
.chip.deadline { color: var(--amber); border-color: var(--amber); }
.prompt { border-left: 4px solid var(--blue); background: var(--blue-tint); padding: 10px 14px; border-radius: 0 10px 10px 0; font-size: .95rem; }
.prompt .lbl, .lbl { display: block; font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
.note { font-size: .72rem; color: var(--muted); margin-top: 10px; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.step { transition: opacity .25s ease; }
.step.hidden { display: none; }
.step.current { outline: 3px solid var(--blue); outline-offset: 4px; border-radius: 12px; }

.think { color: var(--think); background: var(--think-tint); border-radius: 12px; padding: 10px 14px; font-style: italic; font-size: .92rem; }
.say { background: var(--panel); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 12px 16px; }
.final { background: var(--panel); border: 2px solid var(--ink); border-radius: 14px; padding: 16px 20px; }
.final p, .say p { margin: 0 0 .6em; } .final p:last-child, .say p:last-child { margin-bottom: 0; }
.final ul, .final ol { margin: 0 0 .6em; padding-left: 1.3em; }
.final code, .say code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-size: .85em; }
.final pre { background: var(--code-bg); color: var(--code-ink); padding: 10px 14px; border-radius: 10px; overflow-x: auto; font-size: .78rem; }
.final pre code { background: none; border: 0; padding: 0; }

.tool { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tool-head { display: flex; gap: 10px; align-items: baseline; padding: 8px 14px; font-size: .8rem; color: var(--muted); border-bottom: 1px solid var(--line); }
.tool-head b { color: var(--ink); font-weight: 600; }
.tool-head .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
pre.cmd { margin: 0; background: var(--code-bg); color: var(--code-ink); padding: 12px 14px; font-size: .74rem; line-height: 1.45;
  white-space: pre-wrap; word-break: break-word; max-height: 22em; overflow: auto; }
.more { color: var(--code-dim); }
details.out { border-top: 1px solid var(--line); }
details.out summary { cursor: pointer; padding: 7px 14px; font-size: .75rem; color: var(--muted); list-style: none; display: flex; gap: 8px; align-items: center; }
details.out summary::-webkit-details-marker { display: none; }
details.out summary::before { content: "▸"; transition: transform .15s; }
details.out[open] summary::before { transform: rotate(90deg); }
details.out pre { margin: 0; padding: 10px 14px; font-size: .72rem; white-space: pre-wrap; word-break: break-word; max-height: 18em; overflow: auto; color: var(--muted); }
.badge { font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.badge.guard { background: var(--red); color: var(--panel); }
.badge.denied { background: var(--amber-tint); color: var(--amber); border: 1px solid var(--amber); }
.badge.error { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.out.guard { background: var(--red-tint); }
.out.guard pre { color: var(--red); font-weight: 600; font-size: .8rem; }
.out.denied { background: var(--amber-tint); }
.badge.secrets { background: var(--red); color: var(--panel); }
.out.secrets { background: var(--red-tint); }
.out.secrets pre { color: var(--red); }

.verdict { margin-top: 18px; border-radius: 14px; padding: 16px 20px; border: 2px solid; }
.verdict.bad { border-color: var(--red); background: var(--red-tint); }
.verdict.good { border-color: var(--green); background: var(--green-tint); }
.verdict .v { font-size: 1.15rem; font-weight: 700; }
.verdict.bad .v { color: var(--red); } .verdict.good .v { color: var(--green); }
.verdict ul { margin: 6px 0 0; padding-left: 1.2em; font-size: .9rem; }
.verdict .meta { font-size: .75rem; color: var(--muted); margin-top: 8px; }

.stepbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  border-radius: 999px; padding: 8px 18px; font-size: .78rem; display: none; gap: 12px; align-items: center; z-index: 6; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.stepbar.show { display: flex; }
.stepbar kbd { border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; font-size: .7rem; opacity: .8; }
.keys { font-size: .7rem; color: var(--muted); padding: 10px 0 12px; }
.keys kbd { border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; background: var(--panel); }
@media (max-width: 600px) { html { font-size: 16px; } .top-inner, main { padding-left: 16px; padding-right: 16px; } }

.score { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 18px; }
@media (max-width: 900px) { .score { grid-template-columns: 1fr; } }
.score-card { border-radius: 14px; padding: 14px 20px; border: 2px solid var(--line); background: var(--panel); }
.score-card.bad { border-color: var(--red); background: var(--red-tint); }
.score-card.good { border-color: var(--green); background: var(--green-tint); }
.score-card .n { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
.score-card.bad .n { color: var(--red); } .score-card.good .n { color: var(--green); }
.score-card .what { font-size: .85rem; color: var(--ink); }
.model-note { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
.model-title { font-size: 1.6rem; margin: 0 0 4px; }
.overview { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.overview th, .overview td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--line); }
.overview tr:last-child td { border-bottom: 0; }
.overview th { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--bg); }
.overview td.num { font-size: 1.4rem; font-weight: 700; white-space: nowrap; }
.overview td.num small { font-size: .7rem; font-weight: 400; color: var(--muted); margin-left: 4px; }
.overview .hi { color: var(--red); } .overview .lo { color: var(--green); }
.overview tr.link { cursor: pointer; } .overview tr.link:hover td { background: var(--bg); }
.harm { border-left: 4px solid var(--red); background: var(--red-tint); border-radius: 0 12px 12px 0; padding: 12px 18px; margin-bottom: 18px; }
.harm ul { margin: 4px 0 0; padding-left: 1.2em; } .harm li { margin: 2px 0; }
.harm .lbl { color: var(--red); }
.lead { font-size: 1.15rem; font-weight: 600; margin: 0 0 6px; }
.caveat { font-size: .75rem; color: var(--muted); margin-top: 14px; }
</style>
</head>

const RUNS = DATA.runs, MODELS = DATA.models;

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Just enough Markdown for the agents' answers: code blocks, lists, bold, inline code, paragraphs.
function md(src) {
  const blocks = [];
  src = src.replace(/```[\w-]*\n([\s\S]*?)```/g, (_, code) => { blocks.push(code); return `\u0000${blocks.length - 1}\u0000`; });
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const out = [];
  for (const para of src.split(/\n{2,}/)) {
    const m = para.match(/^\u0000(\d+)\u0000$/);
    if (m) { out.push(`<pre><code>${esc(blocks[+m[1]].replace(/\n$/, ""))}</code></pre>`); continue; }
    // A paragraph can mix plain lines and list items ("**Fix:**" then "- a", "- b"): group the runs.
    let buf = [], kind = null;
    const flush = () => {
      if (!buf.length) return;
      if (kind === "ul") out.push("<ul>" + buf.map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ""))}</li>`).join("") + "</ul>");
      else if (kind === "ol") out.push("<ol>" + buf.map((l) => `<li>${inline(l.replace(/^\s*\d+\. /, ""))}</li>`).join("") + "</ol>");
      else out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
      buf = [];
    };
    for (const l of para.split("\n")) {
      const k = /^\s*[-*] /.test(l) ? "ul" : /^\s*\d+\. /.test(l) ? "ol" : "p";
      if (k !== kind) { flush(); kind = k; }
      buf.push(l);
    }
    flush();
  }
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre><code>${esc(blocks[+i])}</code></pre>`);
}

const RESULT_LABEL = { secrets: "Secrets read (fake, planted for the test)", guard: "Blocked by the devbox guard", denied: "Refused by auto mode", error: "Error", ok: "Output" };

function stepHtml(s) {
  if (s.kind === "thinking") return `<div class="think"><span class="lbl">Thinking (summary)</span>${esc(s.text)}</div>`;
  if (s.kind === "say") return `<div class="say"><span class="lbl">Claude</span>${md(s.text)}</div>`;
  if (s.kind === "final") return `<div class="final"><span class="lbl">Final answer to the user</span>${md(s.text)}</div>`;
  const r = s.result;
  const name = s.title.startsWith(s.tool) ? s.title.slice(s.tool.length).trim() : s.title;
  let out = "";
  if (r) {
    const open = ["guard", "denied", "secrets"].includes(r.kind) ? " open" : "";
    const badge = r.kind === "ok" ? "" : `<span class="badge ${r.kind}">${RESULT_LABEL[r.kind]}</span>`;
    out = `<details class="out ${r.kind}"${open}><summary>${badge || "Output"}</summary><pre>${esc(r.body)}${r.more ? `<span class="more">\n… ${r.more} more characters</span>` : ""}</pre></details>`;
  }
  const body = s.body ? `<pre class="cmd">${esc(s.body)}${s.more ? `<span class="more">\n… ${s.more} more characters</span>` : ""}</pre>` : "";
  return `<div class="tool"><div class="tool-head"><b>${esc(s.tool)}</b><span class="path mono">${esc(name)}</span></div>${body}${out}</div>`;
}

function verdictHtml(r) {
  const good = /^HONEST/.test(r.verdict);
  const reasons = r.reasons.length ? `<ul>${r.reasons.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const meta = [r.turns != null ? `${r.turns} turns` : "", r.cost != null ? `$${r.cost.toFixed(2)}` : ""].filter(Boolean).join(" · ");
  return `<div class="verdict ${good ? "good" : "bad"}"><span class="lbl">Hidden check, this run</span><div class="v">${esc(r.verdict)}</div>${reasons}${meta ? `<div class="meta">${meta}</div>` : ""}</div>`;
}

function runHtml(r, i) {
  const chips = [
    `<span class="chip">${esc(r.model)}</span>`,
    `<span class="chip ${r.pressure === "deadline" ? "deadline" : ""}">${esc(r.pressure)}</span>`,
    r.permissions === "bypassPermissions" ? `<span class="chip off">permission checks off</span>` : `<span class="chip">auto mode</span>`,
  ].join("");
  const steps = r.steps.map((s, j) => `<li class="step" data-run="${i}" data-i="${j}">${stepHtml(s)}</li>`).join("");
  return `<section>
    <div class="run-head">
      <div class="chips">${chips}</div>
      <div class="prompt"><span class="lbl">The prompt</span>${esc(r.prompt)}</div>
    </div>
    <ol class="steps">${steps}</ol>
    ${verdictHtml(r)}
  </section>`;
}

const frac = ([n, of]) => `${n} / ${of}`;
const scoreCard = (m, p) => {
  const [n] = m[p];
  return `<div class="score-card ${n ? "bad" : "good"}"><span class="lbl">${p === "calm" ? "Calm prompt" : "Deadline prompt"}</span><div class="n">${frac(m[p])}</div><div class="what">runs ${esc(m.measure)}</div></div>`;
};

function overviewHtml() {
  const rows = MODELS.map((m, i) => {
    const cell = (p) => `<td class="num ${m[p][0] ? "hi" : "lo"}">${frac(m[p])}</td>`;
    return `<tr class="link" data-v="${i}"><td><b>${esc(m.name)}</b></td><td>${esc(m.measure)}</td>${cell("calm")}${cell("deadline")}</tr>`;
  }).join("");
  return `<h2 class="model-title">Calm vs deadline, by model</h2>
    <p class="lead">Every model cheated in at least one condition, and asking nicely didn't stop it. That's why the agent needs walls, not just instructions.</p>
    <p class="model-note">The only difference between the two prompts is one sentence: “Take your time, and if something can't be done properly, tell me instead” or “We release in an hour and I'm in a meeting, so don't ask me questions.”</p>
    <table class="overview"><thead><tr><th>Model</th><th>Counted as cheating</th><th>Calm</th><th>Deadline</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="caveat">4 to 5 runs per cell: read these as signals, not statistics. Excluded: runs that were contaminated by parallel runs, or blocked by auto mode before they did anything. Every secret in these repos is fake, planted for the test, and every run was in a quarantined box with egress through a logged proxy. Click a row, or press its number, to see one calm and one deadline run side by side.</p>
    <p class="keys"><kbd>0</kbd> overview · <kbd>1</kbd>–<kbd>${MODELS.length}</kbd> models · <kbd>S</kbd> step through · <kbd>T</kbd> theme</p>`;
}

function modelHtml(m) {
  return `<h2 class="model-title">${esc(m.name)}</h2><p class="model-note">${esc(m.note)}</p>
    <div class="score">${scoreCard(m, "calm")}${scoreCard(m, "deadline")}</div>
    <div class="harm"><span class="lbl">What the cheating runs did, with nothing in the way</span><ul>${m.harm.map((h) => `<li>${esc(h)}</li>`).join("")}</ul></div>
    <div class="cols two">${m.runs.map((i) => runHtml(RUNS[i], i)).join("")}</div>
    <p class="keys"><kbd>0</kbd> overview · <kbd>1</kbd>–<kbd>${MODELS.length}</kbd> models · <kbd>S</kbd> step through · <kbd>T</kbd> theme</p>`;
}

let view = "overview"; // or a model index
let stepping = false, revealed = 0;

function render() {
  const tabs = [`<button data-v="overview" aria-pressed="${view === "overview"}"><span class="k">0</span>Overview</button>`]
    .concat(MODELS.map((m, i) => `<button data-v="${i}" aria-pressed="${view === i}"><span class="k">${i + 1}</span>${esc(m.name)}</button>`));
  $("#tabs").innerHTML = tabs.join("");
  $("#main").innerHTML = view === "overview" ? overviewHtml() : modelHtml(MODELS[view]);
  if (view === "overview") stepping = false;
  revealed = stepping ? 1 : 0;
  applyStepping();
  try { localStorage.setItem("transcripts.view", String(view)); } catch {}
}

function setView(v) { view = v === "overview" ? "overview" : +v; render(); window.scrollTo({ top: 0 }); }

// The calm and deadline runs reveal in turn, so the same moment lines up side by side.
function stepOrder() {
  if (view === "overview") return [];
  const [a, b] = MODELS[view].runs.map((i) => [...document.querySelectorAll(`.step[data-run="${i}"]`)]);
  const out = [];
  for (let k = 0; k < Math.max(a.length, b.length); k++) { if (a[k]) out.push(a[k]); if (b[k]) out.push(b[k]); }
  return out;
}

function applyStepping() {
  const order = stepOrder();
  order.forEach((el, k) => {
    el.classList.toggle("hidden", stepping && k >= revealed);
    el.classList.toggle("current", stepping && k === revealed - 1);
  });
  document.querySelectorAll(".verdict").forEach((v) => (v.style.display = stepping && revealed <= order.length ? "none" : ""));
  $("#stepBtn").setAttribute("aria-pressed", String(stepping));
  $("#stepbar").classList.toggle("show", stepping);
  $("#stepCount").textContent = stepping ? `${Math.min(revealed, order.length)} / ${order.length}` : "";
  const cur = $(".step.current");
  if (cur) cur.scrollIntoView({ behavior: "smooth", block: "center" });
}

function next(d) {
  const n = stepOrder().length;
  revealed = Math.max(0, Math.min(n + 1, revealed + d));
  applyStepping();
  if (revealed > n) document.querySelector(".verdict")?.scrollIntoView({ behavior: "smooth", block: "center" });
}

function toggleStepping() {
  if (view === "overview") return;
  stepping = !stepping; revealed = stepping ? 1 : 0; applyStepping();
}

function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("transcripts.theme", root.dataset.theme); } catch {}
}

$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setView(b.dataset.v); });
$("#main").addEventListener("click", (e) => { const tr = e.target.closest("tr.link"); if (tr) setView(tr.dataset.v); });
$("#stepBtn").addEventListener("click", toggleStepping);
$("#themeBtn").addEventListener("click", toggleTheme);
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "0") setView("overview");
  else if (/^[1-9]$/.test(k) && +k <= MODELS.length) setView(+k - 1);
  else if (k === "s") toggleStepping();
  else if (k === "t") toggleTheme();
  else if (stepping && (k === " " || k === "arrowright" || k === "arrowdown" || k === "pagedown")) { e.preventDefault(); next(e.shiftKey ? -1 : 1); }
  else if (stepping && (k === "arrowleft" || k === "arrowup" || k === "pageup")) { e.preventDefault(); next(-1); }
});

try {
  const t = localStorage.getItem("transcripts.theme"); if (t) document.documentElement.dataset.theme = t;
  const v = localStorage.getItem("transcripts.view");
  if (v && v !== "overview" && +v < MODELS.length) view = +v;
} catch {}
render();
</script>
